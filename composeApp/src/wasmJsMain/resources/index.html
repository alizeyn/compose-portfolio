<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ali Zeynali — UI/UX</title>
  <meta name="description" content="Mobile engineer of eight-odd years turning product designer. Vienna-based, flipping the coin from engineer to designer.">
  <meta name="theme-color" content="#faf8f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#131318" media="(prefers-color-scheme: dark)">
  <meta property="og:type" content="website">
  <meta property="og:title" content="Ali Zeynali — UI/UX">
  <meta property="og:description" content="Mobile engineer of eight-odd years turning product designer. Vienna-based, flipping the coin from engineer to designer.">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script type="application/javascript" src="composeApp.js"></script>
</head>
<body>
  <div id="loader" aria-live="polite">
    <div class="ring"></div>
    <p>Loading…</p>
  </div>
  <noscript>
    <main class="noscript">
      <h1>Ali Zeynali</h1>
      <p>Mobile engineer turning product designer, based in Vienna. This site is drawn with Compose Multiplatform and needs JavaScript and WebAssembly.</p>
      <p><a href="mailto:the.ali.zeynali@gmail.com">the.ali.zeynali@gmail.com</a> · <a href="https://www.linkedin.com/in/alizeynali/">LinkedIn</a></p>
    </main>
  </noscript>
  <script>
    // Remove the loader once Compose has attached its canvas to the body.
    new MutationObserver(function (mutations, observer) {
      if (document.querySelector('body > canvas')) {
        var l = document.getElementById('loader');
        if (l) l.remove();
        observer.disconnect();
      }
    }).observe(document.body, { childList: true });
  </script>
</body>
</html>
